[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "companyx-bi"
version = "0.1.0"
description = "CompanyX sales warehouse and reproducible weekly forecasting"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "statsmodels>=0.14,<0.16", "scikit-learn>=1.5,<2", "pyodbc>=5,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=5", "jsonschema>=4"]
boost = ["xgboost>=2,<4"]

[project.scripts]
companyx = "companyx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
